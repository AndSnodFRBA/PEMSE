# This file is shared by every Railway service that deploys this repo
# (production and the demo instance alike) — it is not where per-service
# secrets like DATABASE_URL live. Each service must have its own
# DATABASE_URL set in that service's Railway Variables, pointing at its
# own Postgres addon (e.g. ${{Postgres.DATABASE_URL}}). Without it, Django
# silently falls back to an ephemeral SQLite file inside the container
# (see the DATABASE_URL default in pemse/settings.py), and all data is
# lost on every redeploy. This happened to the demo instance's
# pemse-demo-web service until DATABASE_URL was added there directly.

[build]
builder = "nixpacks"

[deploy]
startCommand = "export PYTHONUNBUFFERED=1 && python manage.py backup_database --trigger=deploy && python manage.py migrate --run-syncdb && python manage.py seed_courses && python manage.py seed_handbook && python manage.py seed_documents && python manage.py archive_completed_courses && python manage.py sync_instructor_license_events && python manage.py check_retention_flags && python manage.py check_late_fees && python manage.py send_deadline_notifications && python manage.py collectstatic --noinput && if [ \"$DEMO_MODE\" = \"True\" ]; then python manage.py seed_emt_hybrid_schedule && python manage.py seed_demo_data; fi && gunicorn pemse.wsgi --bind 0.0.0.0:${PORT:-8000} --workers 2 --worker-class gthread --threads 4 --timeout 120"
healthcheckPath = "/health/"
healthcheckTimeout = 300
restartPolicyType = "never"
