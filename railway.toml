[build]
builder = "nixpacks"

[deploy]
startCommand = "export PYTHONUNBUFFERED=1 && python manage.py backup_database --trigger=deploy && python manage.py migrate --run-syncdb && python manage.py seed_courses && python manage.py seed_handbook && python manage.py seed_documents && python manage.py archive_completed_courses && python manage.py sync_instructor_license_events && python manage.py check_retention_flags && python manage.py collectstatic --noinput && gunicorn pemse.wsgi --bind 0.0.0.0:${PORT:-8000} --workers 2 --worker-class gthread --threads 4 --timeout 120"
healthcheckPath = "/health/"
healthcheckTimeout = 300
restartPolicyType = "never"
