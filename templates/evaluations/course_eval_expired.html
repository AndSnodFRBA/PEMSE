<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluation Unavailable — PEMSE</title>
  {% load static %}
  <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
  <link rel="apple-touch-icon" href="{% static 'images/favicon.ico' %}">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; }
  </style>
</head>
<body>
<div class="container py-5" style="max-width:480px;">
  <div class="card text-center p-5">
    <i class="bi bi-clock-history" style="font-size:40px;color:#d97706;margin-bottom:16px;"></i>
    <h2 style="font-size:20px;font-weight:700;color:#1a2e4a;">Evaluation No Longer Available</h2>
    <p style="color:#6b7280;font-size:13px;line-height:1.65;">
      This evaluation link has expired. Please contact PEMSE staff if you believe this is an error.
    </p>
    <a href="{% url 'course_eval_list' %}"
       style="background:#2B5EA7;color:#fff;border-radius:9px;padding:11px 22px;text-decoration:none;font-size:13px;font-weight:600;display:inline-block;margin-top:8px;">
      Back to Evaluations
    </a>
  </div>
</div>
</body>
</html>
