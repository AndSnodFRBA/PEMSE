<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — {{ AGENCY_NAME }}</title>
  {% load static %}
  <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
  <link rel="apple-touch-icon" href="{% static 'images/favicon.ico' %}">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; }
  </style>
</head>
<body>
<div class="container py-5" style="max-width:520px;">
  <div class="card text-center p-5">
    <div style="width:70px;height:70px;background:#d1fae5;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
      <i class="bi bi-check-circle-fill" style="font-size:34px;color:#059669;"></i>
    </div>
    <h2 style="font-size:22px;font-weight:700;color:#1a2e4a;margin-bottom:8px;">Thank you!</h2>
    <p style="color:#6b7280;font-size:14px;line-height:1.6;margin-bottom:6px;">
      Your <strong>{{ eval.get_eval_type_display }}</strong> for
      <strong>{{ eval.course.name }}</strong> has been submitted.
    </p>
    <p style="color:#9ca3af;font-size:12px;margin-bottom:28px;">
      Your feedback helps {{ AGENCY_NAME }} improve the program for future students.
    </p>
    <a href="{% url 'course_eval_list' %}"
       style="background:#2B5EA7;color:#fff;border-radius:9px;padding:12px 24px;text-decoration:none;font-size:14px;font-weight:600;display:inline-block;">
      Back to Evaluations
    </a>
  </div>
  <p style="font-size:11px;color:#9ca3af;text-align:center;margin-top:20px;">{{ AGENCY_NAME }}</p>
</div>
</body>
</html>
