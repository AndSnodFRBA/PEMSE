<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Already Submitted — Panhandle EMS Education</title>
  {% load static %}
  <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
  <link rel="apple-touch-icon" href="{% static 'images/favicon.ico' %}">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>body { font-family: 'DM Sans', sans-serif; background: #f0f4f8; }</style>
</head>
<body>
<div class="container py-5" style="max-width:520px;">
  <div class="card text-center py-5 px-4">
    <div style="width:72px;height:72px;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
      <i class="bi bi-info-circle" style="color:#1e3a8a;font-size:34px;"></i>
    </div>
    <h3 style="color:#1a2e4a;font-weight:700;">Already submitted</h3>
    <p style="color:#374151;font-size:14px;" class="mb-2">
      An evaluation for <strong>{{ eval.rotation.student.get_full_name }}</strong> has already been completed using this link.
    </p>
    <p style="color:#6b7280;font-size:13px;">
      Each evaluation link can only be used once. If you believe this is an error,
      please contact Panhandle EMS Education directly.
    </p>
    <hr style="border-color:#e5e7eb;">
    <p style="font-size:12px;color:#9ca3af;">Panhandle EMS Education</p>
  </div>
</div>
</body>
</html>
