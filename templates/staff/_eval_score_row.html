<div class="d-flex justify-content-between align-items-center py-1" style="font-size:12px;">
  <span style="color:#6b7280;">{{ label }}</span>
  <span style="font-weight:700;color:{% if value >= 4 %}#065f46{% elif value == 3 %}#92600a{% elif value %}#991b1b{% else %}#d1d5db{% endif %};">
    {% if value %}{{ value }}/5{% else %}—{% endif %}
  </span>
</div>
