<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Complete — PEMSE</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
  <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
  <link rel="apple-touch-icon" href="{% static 'images/favicon.ico' %}">
  <link rel="stylesheet" href="{% static 'css/portal.css' %}">
</head>
<body>
  <div class="auth-wrap">
    <div>
      <div class="auth-logo">
        <img src="{% static 'images/PEMSE.jpg' %}" alt="Panhandle EMS Education"
             class="auth-logo-img" onerror="this.style.display='none';">
        <div class="auth-logo-name">Panhandle EMS Education</div>
        <div class="auth-logo-sub">Password Reset</div>
      </div>

      <div class="auth-card" style="text-align:center;">
        <div style="font-size:32px;margin-bottom:10px;">✅</div>
        <h2 style="font-size:20px;font-weight:600;color:#2B5EA7;margin-bottom:4px;">Password changed</h2>
        <p style="font-size:13px;color:#5a7a9a;margin-bottom:20px;">
          Your password has been reset successfully. You can now sign in.
        </p>

        <a href="{% url 'login' %}" class="btn-navy w-100" style="padding:12px;display:block;">Sign in — Student Portal</a>
        <div style="margin-top:10px;display:flex;gap:8px;justify-content:center;font-size:12px;">
          <a href="{% url 'staff_login' %}" style="color:#2B5EA7;">Staff login</a>
          <span style="color:#c8d8e8;">·</span>
          <a href="{% url 'instructor_login' %}" style="color:#2B5EA7;">Instructor login</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
