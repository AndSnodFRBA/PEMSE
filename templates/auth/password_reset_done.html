<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Your Email — {{ AGENCY_SHORT_NAME }}</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
  <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
  <link rel="apple-touch-icon" href="{% static 'images/favicon.ico' %}">
  <link rel="stylesheet" href="{% static 'css/portal.css' %}">
  <style>
    :root {
      --navy: {{ AGENCY_NAVY }};
      --accent: {{ AGENCY_ACCENT }};
    }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div>
      <div class="auth-logo">
        <img src="{% static 'images/PEMSE.jpg' %}" alt="{{ AGENCY_NAME }}"
             class="auth-logo-img" onerror="this.style.display='none';">
        <div class="auth-logo-name">{{ AGENCY_NAME }}</div>
        <div class="auth-logo-sub">Password Reset</div>
      </div>

      <div class="auth-card" style="text-align:center;">
        <div style="font-size:32px;margin-bottom:10px;">📬</div>
        <h2 style="font-size:20px;font-weight:600;color:#2B5EA7;margin-bottom:4px;">Check your email</h2>
        <p style="font-size:13px;color:#5a7a9a;margin-bottom:0;">
          If an account exists with that email address, we've sent a link to reset your password.
          The link expires in a few hours.
        </p>

        <div style="margin-top:20px;">
          <a href="{% url 'login' %}" style="color:#2B5EA7;font-weight:600;font-size:13px;text-decoration:none;">← Back to sign in</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
