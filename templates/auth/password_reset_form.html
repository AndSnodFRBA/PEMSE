<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — {{ AGENCY_SHORT_NAME }}</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
  <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
  <link rel="apple-touch-icon" href="{% static 'images/favicon.ico' %}">
  <link rel="stylesheet" href="{% static 'css/portal.css' %}">
  <style>
    :root {
      --navy: {{ AGENCY_NAVY }};
      --accent: {{ AGENCY_ACCENT }};
    }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div>
      <div class="auth-logo">
        <img src="{% static 'images/PEMSE.jpg' %}" alt="{{ AGENCY_NAME }}"
             class="auth-logo-img" onerror="this.style.display='none';">
        <div class="auth-logo-name">{{ AGENCY_NAME }}</div>
        <div class="auth-logo-sub">Password Reset</div>
      </div>

      <div class="auth-card">
        <h2 style="font-size:20px;font-weight:600;color:#2B5EA7;margin-bottom:4px;">Forgot your password?</h2>
        <p style="font-size:13px;color:#5a7a9a;margin-bottom:22px;">Enter your account email and we'll send you a link to reset it.</p>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" name="email" class="form-control" placeholder="jane@email.com" autofocus required>
          </div>
          <button type="submit" class="btn-navy w-100" style="padding:12px;">Send reset link →</button>
        </form>

        <div style="text-align:center;margin-top:18px;font-size:13px;color:#5a7a9a;">
          <a href="{% url 'login' %}" style="color:#2B5EA7;font-weight:600;">← Back to sign in</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
